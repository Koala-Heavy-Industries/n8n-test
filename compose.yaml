# 検証環境 — n8n / Keycloak / Mailpit
#
# 設計: docs/design/05-environment.md
# 起動:  cp .env.example .env && docker compose up -d
#
# NetBox(PC・サーバ登録用)はロードマップ第6段階で追加する。
# それまでは Keycloak を対象にしたメンバーライフサイクルの検証に集中する。

name: khi-itops

services:
  # ---------- n8n ----------
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.35.7
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?}
      # credential の復号鍵。失うと全 credential が復元できない(別管理でバックアップ)
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?}
      # Webhook(台帳のマージ通知・承認/完了リンク)の外部 URL
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${TZ:-Asia/Tokyo}
      TZ: ${TZ:-Asia/Tokyo}
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_SURVEY_ENABLED: "false"
      # Code ノードから YAML を読み書きするために許可する(台帳が YAML のため)。
      # yaml パッケージは n8n の依存として同梱されている。
      NODE_FUNCTION_ALLOW_EXTERNAL: "yaml"
      # 完了リンクのトークン生成に使う
      NODE_FUNCTION_ALLOW_BUILTIN: "crypto"
      # ワークフローから $env で設定値を参照する(下の設定値を注入するため)。
      # n8n は既にすべての credential を保持する信頼境界なので、
      # ここで env を開けても脅威モデルは変わらない(docs/design/08-safeguards.md)。
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # --- ワークフローが $env で読む設定値 ---
      LEDGER_REPO: ${LEDGER_REPO:-Koala-Heavy-Industries/khi-ledger}
      GITHUB_ORG: ${GITHUB_ORG:-Koala-Heavy-Industries}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-khi-dev}
      NOTIFY_FROM: ${NOTIFY_FROM:-itops-bot@example.com}
      APPROVER_EMAILS: ${APPROVER_EMAILS:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      LICENSE_ASSIGNEE: ${LICENSE_ASSIGNEE:-}
      REMIND_INTERVAL_DAYS: ${REMIND_INTERVAL_DAYS:-3}
      REMIND_MAX: ${REMIND_MAX:-3}
      REVOKE_CIRCUIT_BREAKER: ${REVOKE_CIRCUIT_BREAKER:-5}
    volumes:
      - n8n_data:/home/node/.n8n
      # ワークフロー定義は Git 管理し、CLI でインポートする
      # (docker compose exec n8n n8n import:workflow --separate --input=/workflows)
      - ./workflows:/workflows:ro
    depends_on:
      n8n-postgres:
        condition: service_healthy

  n8n-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:?}
    volumes:
      - n8n_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------- Keycloak(プロジェクト IdP) ----------
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    restart: unless-stopped
    # 検証用。本番は start(+TLS・ホスト名設定)にする
    command: start-dev
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      KC_HEALTH_ENABLED: "true"
      TZ: ${TZ:-Asia/Tokyo}
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  keycloak-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
    volumes:
      - keycloak_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------- Mailpit(通知チャネル未決のまま検証するための受信箱) ----------
  mailpit:
    image: axllent/mailpit:v1.31.0
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP(n8n / Keycloak からの送信先)
      - "8025:8025" # Web UI
    environment:
      MP_MAX_MESSAGES: "2000"
      TZ: ${TZ:-Asia/Tokyo}

volumes:
  n8n_data:
  n8n_db:
  keycloak_db:
